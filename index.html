<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marcvs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  /* sediment — visto em perfil ============================== */
  :root {
    --bg:        #E8F1F5;
    --bg-deep:   #d9e6ec;
    --ink:       #0e2935;
    --ink-soft:  #4a6b78;

    /* gradação de azuis para os estratos */
    --c-1: #1A6B85;
    --c-2: #4A9BB8;
    --c-3: #00C8D4;
    --c-4: #2E7D8F;
    --c-5: #0a4858;
    --c-6: #6FB5C9;

    --grotesk: "Space Grotesk", "Inter", system-ui, sans-serif;
    --mono:    "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
    --serif:   "EB Garamond", "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--grotesk);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* fundo: scanlines + ruído sutil */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(10, 72, 88, 0.025) 0,
        rgba(10, 72, 88, 0.025) 1px,
        transparent 1px,
        transparent 3px
      );
    mix-blend-mode: multiply;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* page-level fade ----------------------------------------- */
  body { opacity: 0; transition: opacity 520ms ease; }
  body.loaded  { opacity: 1; }
  body.leaving { opacity: 0; }

  /* shell --------------------------------------------------- */
  .shell {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 44px 80px 80px;
  }

  /* HEADER (mantido idêntico) ------------------------------- */
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 0;
  }
  .meta > div:last-child { text-transform: uppercase; }
  .meta > div:last-child a { text-transform: lowercase; letter-spacing: 0.04em; }
  .meta a { color: inherit; text-decoration: none; border-bottom: none; }
  .meta a:hover { color: var(--ink); }
  .meta .dot { opacity: 0.45; margin: 0 .5ch; }

  .mark {
    font-family: var(--grotesk);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
    color: var(--ink);
  }
  .mark .m {
    font-weight: 400;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 560px;
  }
  .mark .m em {
    font-style: normal;
    color: var(--c-1);
  }

  /* SHUFFLE ------------------------------------------------- */
  .shuffle-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 60px;
    padding-bottom: 16px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .shuffle {
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    cursor: crosshair;
    padding: 4px 0;
    transition: color .25s ease, letter-spacing .35s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .shuffle:hover { color: var(--c-1); letter-spacing: 0.32em; }
  .shuffle .icon {
    display: inline-block;
    transition: transform .6s cubic-bezier(.5,.05,.2,1);
  }
  .shuffle.spinning .icon { transform: rotate(540deg); }

  /* SEDIMENT — strata stack -------------------------------- */
  .strata {
    position: relative;
    margin-top: 24px;
    padding: 60px 0 120px;
    min-height: 70vh;
  }

  /* régua de profundidade discreta à esquerda */
  .strata::before {
    content: "";
    position: absolute;
    left: 0;
    top: 24px;
    bottom: 24px;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent,
      rgba(10, 72, 88, 0.18) 12%,
      rgba(10, 72, 88, 0.18) 88%,
      transparent
    );
  }

  .stratum {
    position: relative;
    display: block;
    width: max-content;
    max-width: 80%;
    text-decoration: none;
    cursor: crosshair;
    transition: color .35s ease;
    will-change: transform;
  }

  .stratum .label {
    display: block;
    font-family: var(--grotesk);
    line-height: 0.95;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    transition: text-shadow .25s ease, transform .25s ease;
    position: relative;
  }

  .stratum .depth {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 8px;
    opacity: 0.55;
  }

  .stratum .desc {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-top: 6px;
    max-width: 360px;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
  }
  .stratum:hover .desc { opacity: 0.9; transform: translateY(0); }

  /* hover: pequeno glitch chromático mais forte */
  .stratum:hover .label {
    text-shadow:
      -1.5px 0 rgba(0, 200, 212, 0.85),
      1.5px 0 rgba(216, 75, 168, 0.6);
  }

  /* per-stratum styles: tamanho, peso, cor, posição */
  .stratum.s1 { color: var(--c-1); }
  .stratum.s1 .label { font-size: clamp(48px, 7vw, 96px); font-weight: 500; }

  .stratum.s2 { color: var(--c-3); }
  .stratum.s2 .label { font-size: clamp(36px, 5.5vw, 76px); font-weight: 300; letter-spacing: 0.08em; }

  .stratum.s3 { color: var(--c-2); }
  .stratum.s3 .label { font-size: clamp(54px, 8vw, 112px); font-weight: 400; }

  .stratum.s4 { color: var(--c-4); }
  .stratum.s4 .label { font-size: clamp(32px, 4.5vw, 60px); font-weight: 500; letter-spacing: 0.12em; }

  .stratum.s5 { color: var(--c-5); }
  .stratum.s5 .label { font-size: clamp(40px, 6vw, 84px); font-weight: 400; }

  .stratum.s6 { color: var(--c-2); }
  .stratum.s6 .label { font-size: clamp(38px, 5.8vw, 80px); font-weight: 400; letter-spacing: 0.04em; font-style: italic; font-family: var(--serif); }

  /* placeholder slot — visualmente mais sutil */
  .stratum.placeholder {
    color: var(--ink-soft);
    pointer-events: none;
  }
  .stratum.placeholder .label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0.35;
  }
  .stratum.placeholder .label::before { content: "[ "; }
  .stratum.placeholder .label::after { content: " ]"; }

  /* glitch state — applied via JS */
  .glitching .label {
    animation: glitch 200ms steps(2, end);
  }
  @keyframes glitch {
    0%   { transform: translateX(0);   text-shadow: none; clip-path: inset(0 0 0 0); }
    20%  { transform: translateX(-4px); text-shadow: 2px 0 rgba(0, 200, 212, 0.9), -2px 0 rgba(216, 75, 168, 0.7); clip-path: inset(20% 0 35% 0); }
    40%  { transform: translateX(5px);  text-shadow: -2px 0 rgba(0, 200, 212, 0.9), 2px 0 rgba(216, 75, 168, 0.7); clip-path: inset(45% 0 10% 0); }
    60%  { transform: translateX(-3px); text-shadow: 1.5px 0 rgba(0, 200, 212, 0.7); clip-path: inset(0 0 0 0); }
    100% { transform: translateX(0);   text-shadow: none; clip-path: inset(0 0 0 0); }
  }

  /* during shuffle, all strata slide smoothly */
  .strata.shuffling .stratum-wrap {
    transition: margin-left 600ms cubic-bezier(.4, .0, .2, 1);
  }

  .stratum-wrap {
    position: relative;
    transition: margin-left 600ms cubic-bezier(.4, .0, .2, 1);
  }

  /* spacing between strata: irregular */
  .stratum-wrap + .stratum-wrap { margin-top: var(--gap, 80px); }

  /* footer ------------------------------------------------- */
  .foot {
    margin-top: 80px;
    padding-top: 22px;
    border-top: 1px solid rgba(10, 72, 88, 0.12);
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .foot a { color: inherit; text-decoration: none; border-bottom: none; }
  .foot a:hover { color: var(--ink); }

  @media (max-width: 720px) {
    .shell { padding: 28px 24px 56px; }
    .strata { padding: 40px 0 80px; }
    .stratum { max-width: 100%; }
    .stratum-wrap + .stratum-wrap { margin-top: 56px; }
    .stratum.s1 .label { font-size: 44px; }
    .stratum.s2 .label { font-size: 32px; }
    .stratum.s3 .label { font-size: 48px; }
    .stratum.s4 .label { font-size: 28px; }
    .stratum.s5 .label { font-size: 36px; }
    .stratum.s6 .label { font-size: 34px; }
    .stratum.placeholder .label { font-size: 11px; letter-spacing: 0.3em; }
  }
</style>
</head>
<body data-page="home">

<div class="shell">

  <header class="meta">
    <div class="mark">marcvs<span class="m"><em>artist</em><br>random.(image, music, text)<br>prompting cartographies in the technocracy</span></div>
    <div>são paulo <span class="dot">·</span> 23°32′s 46°38′w</div>
  </header>

  <div class="shuffle-row">
    <button class="shuffle" type="button" aria-label="shuffle strata">
      <span class="icon">↻</span>
      <span>shuffle</span>
    </button>
  </div>

  <main class="strata" id="strata"></main>

  <footer class="foot">
    <div>23°32′s 46°38′w · marcvs · 2026</div>
    <div>são paulo</div>
  </footer>

</div>

<script src="fade.js"></script>
<script>
  // ============================================================
  // Strata list. To add a new link, just append an object here —
  // the system generates the rest on its own.
  // ============================================================
  const STRATA = [
    {
      label: "my drawer of dreams",
      href:  "https://manifold.xyz/@marcvs",
      desc:  "contract on ethereum (manifold). mostly ai stuff",
      depth: "stratum 01 · −12m",
      cls:   "s1",
      offset: 8,        // initial horizontal %
      float: { x: 2, y: 3, dur: 8.4,  delay: 0   },
      glitch: { every: [6, 12] }
    },
    {
      label: "colors from within",
      href:  "https://www.transient.xyz/nfts/ethereum/0x80bf8004eb223ada632e4b674ac0ce4d6e464922",
      desc:  "my foundation (rip) contract, now on transient. digital paintings, film and ai stuff.",
      depth: "stratum 02 · −38m",
      cls:   "s2",
      offset: 58,
      float: { x: 3, y: 2, dur: 11.2, delay: 1.4 },
      glitch: { every: [8, 15] }
    },
    {
      label: "objkt: art on tezos",
      href:  "https://objkt.com/users/tz1LxMnuPvqrYo4Z1TnVon1zrVu6VwJfuxwa/created",
      desc:  "digital paintings, glitched photography, films and poetry",
      depth: "stratum 03 · −67m",
      cls:   "s3",
      offset: 22,
      float: { x: 2, y: 4, dur: 7.6,  delay: 0.8 },
      glitch: { every: [5, 10] }
    },
    {
      label: "music",
      href:  "som.html",
      desc:  "releases, eps and b-sides",
      depth: "stratum 04 · −94m",
      cls:   "s4",
      offset: 70,
      float: { x: 4, y: 2, dur: 9.5,  delay: 2.1 },
      glitch: { every: [7, 14] }
    },
    {
      label: "fragments of acrylic",
      href:  "https://gamma.io/ordinals/collections/fragments-of-acrylic",
      desc:  "ordinal art on bitcoin · gamma",
      depth: "stratum 05 · −115m",
      cls:   "s6",
      offset: 14,
      float: { x: 3, y: 3, dur: 10.3, delay: 1.9 },
      glitch: { every: [7, 13] }
    },
    {
      label: "sedimenting",
      href:  null,
      desc:  null,
      depth: "stratum 05 · −??m",
      cls:   "s5 placeholder",
      offset: 38,
      float: { x: 2, y: 3, dur: 13.0, delay: 3.2 },
      glitch: { every: [9, 18] }
    }
  ];

  const root = document.getElementById('strata');

  // On every load: shuffle order and randomize horizontal offset.
  // Fisher–Yates on a copy so the source STRATA array stays intact.
  const ORDER = STRATA.slice();
  for (let i = ORDER.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ORDER[i], ORDER[j]] = [ORDER[j], ORDER[i]];
  }

  // build DOM
  ORDER.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'stratum-wrap';
    wrap.style.setProperty('--gap', (60 + (i % 3) * 30) + 'px');
    wrap.style.marginLeft = Math.floor(Math.random() * 70) + '%';

    const tag = s.href ? 'a' : 'div';
    const el = document.createElement(tag);
    el.className = 'stratum ' + s.cls;
    if (s.href) {
      el.href = s.href;
      if (/^https?:/.test(s.href)) { el.target = '_blank'; el.rel = 'noopener'; }
    }
    el.innerHTML =
      '<span class="label">' + s.label + '</span>' +
      (s.desc ? '<span class="desc">' + s.desc + '</span>' : '');

    // floating animation via Web Animations API
    const fx = s.float.x, fy = s.float.y;
    const anim = el.animate(
      [
        { transform: 'translate(0px, 0px)' },
        { transform: 'translate(' +  fx + 'px, ' + (-fy) + 'px)' },
        { transform: 'translate(' + (-fx*0.6) + 'px, ' + fy + 'px)' },
        { transform: 'translate(0px, 0px)' }
      ],
      {
        duration: s.float.dur * 1000,
        delay: s.float.delay * 1000,
        iterations: Infinity,
        easing: 'ease-in-out'
      }
    );
    el._anim = anim;

    // pause on hover
    el.addEventListener('mouseenter', () => {
      anim.playbackRate = 0.15;
      // stronger glitch on hover
      el.classList.remove('glitching');
      void el.offsetWidth;
      el.classList.add('glitching');
    });
    el.addEventListener('mouseleave', () => { anim.playbackRate = 1; });

    // schedule random glitches
    const scheduleGlitch = () => {
      const [lo, hi] = s.glitch.every;
      const wait = (lo + Math.random() * (hi - lo)) * 1000;
      setTimeout(() => {
        el.classList.remove('glitching');
        void el.offsetWidth;
        el.classList.add('glitching');
        scheduleGlitch();
      }, wait);
    };
    setTimeout(scheduleGlitch, 1500 + Math.random() * 4000);

    wrap.appendChild(el);
    root.appendChild(wrap);
  });

  // shuffle: randomize BOTH horizontal offset and vertical order.
  // Uses FLIP technique to animate the DOM reordering smoothly.
  const shuffleBtn = document.querySelector('.shuffle');
  shuffleBtn.addEventListener('click', () => {
    shuffleBtn.classList.add('spinning');

    const wraps = [...root.querySelectorAll('.stratum-wrap')];

    // FIRST — record current positions
    const firstRects = new Map();
    wraps.forEach(w => firstRects.set(w, w.getBoundingClientRect()));

    // shuffle DOM order (Fisher–Yates)
    const shuffled = wraps.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    shuffled.forEach(w => root.appendChild(w));

    // also randomize horizontal offset
    shuffled.forEach(w => {
      const newOffset = Math.floor(Math.random() * 70);
      w.style.marginLeft = newOffset + '%';
    });

    // LAST + INVERT + PLAY
    requestAnimationFrame(() => {
      shuffled.forEach((w, i) => {
        const last = w.getBoundingClientRect();
        const first = firstRects.get(w);
        const dx = first.left - last.left;
        const dy = first.top  - last.top;
        // reset to old position with no transition
        w.style.transition = 'none';
        w.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
        // force reflow, then animate to natural position
        void w.offsetWidth;
        w.style.transition = 'transform 700ms cubic-bezier(.4,0,.2,1)';
        w.style.transform = 'translate(0, 0)';

        // glitch burst during recalibration
        const el = w.querySelector('.stratum');
        let bursts = 3;
        const burst = () => {
          el.classList.remove('glitching');
          void el.offsetWidth;
          el.classList.add('glitching');
          if (--bursts > 0) setTimeout(burst, 180);
        };
        setTimeout(burst, i * 80);
      });
    });

    setTimeout(() => {
      shuffleBtn.classList.remove('spinning');
      // clear inline transform/transition so float animation owns transform again
      shuffled.forEach(w => {
        w.style.transition = '';
        w.style.transform = '';
      });
    }, 800);
  });

  // mobile: dampen offsets
  if (window.matchMedia('(max-width: 720px)').matches) {
    [...root.querySelectorAll('.stratum-wrap')].forEach(w => {
      const cur = parseFloat(w.style.marginLeft);
      w.style.marginLeft = (cur * 0.35) + '%';
    });
  }
</script>
</body>
</html>
