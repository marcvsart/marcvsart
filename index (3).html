<style>
  /* ============================================================
     marcvs.art v3 — MAINFRAME
     early computer graphics. monocromático: branco e cinzas
     sobre preto, fósforo verde só onde o sistema fala.
     estratos viram um filesystem.
     ============================================================ */
  :root {
    --black:  #060707;
    --white:  #f4f4f0;   /* fósforo branco P4 */
    --g1:     #c9c9c2;
    --g2:     #8e8e88;
    --g3:     #55554f;
    --g4:     #2c2c28;
    --green:  #33ff66;   /* fósforo verde P1 — só o sistema usa */

    --pixel: "VT323", monospace;
    --plex:  "IBM Plex Mono", ui-monospace, monospace;
    --mono:  "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--black);
    color: var(--g1);
    font-family: var(--mono);
    font-size: 16px;
    overflow-x: hidden;
  }

  ::selection { background: var(--white); color: var(--black); }

  /* scanlines discretas + leve vinheta de tubo */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0, rgba(0,0,0,0.18) 1px,
      transparent 1px, transparent 3px);
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 51;
    background: radial-gradient(ellipse at center,
      transparent 60%, rgba(0,0,0,0.5) 100%);
  }

  /* ---- wireframe floor (canvas, assinatura early-CG) -------- */
  #wire {
    position: fixed; left: 0; right: 0; bottom: 0;
    width: 100%; height: 46vh;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  /* ---- boot: terminal digitando ------------------------------ */
  .boot {
    position: fixed; inset: 0; z-index: 100;
    background: var(--black);
    padding: 40px 64px;
    font-family: var(--pixel);
    font-size: 19px;
    color: var(--green);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .boot.done { animation: bootout 200ms forwards; }
  @keyframes bootout { to { opacity: 0; visibility: hidden; } }

  .stage { opacity: 0; }
  .stage.on { animation: tube-on 360ms steps(4) forwards; }
  @keyframes tube-on {
    0% { opacity: 0; filter: brightness(2.4); }
    100% { opacity: 1; filter: none; }
  }

  /* ---- shell -------------------------------------------------- */
  .shell {
    position: relative; z-index: 2;
    max-width: 1240px;
    margin: 0 auto;
    padding: 36px 64px 56px;
  }

  /* ---- topbar -------------------------------------------------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--g3);
  }
  .topbar .sys { color: var(--green); }
  .topbar .sys .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .coords { text-align: right; line-height: 1.9; text-transform: lowercase; }

  /* ---- mark: discreto, saída de terminal ----------------------- */
  .mark { margin-top: 72px; }
  .mark .cmdline {
    font-family: var(--plex);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--g3);
    text-transform: lowercase;
    margin-bottom: 14px;
  }
  .mark .cmdline .prompt { color: var(--green); }
  .mark h1 {
    margin: 0;
    font-family: var(--plex);
    font-weight: 300;
    font-size: clamp(30px, 4.2vw, 46px);
    letter-spacing: 0.34em;
    text-transform: lowercase;
    color: var(--white);
    line-height: 1;
    cursor: crosshair;
    width: max-content; max-width: 100%;
  }
  /* letras individuais: desintegram no hover via js */
  .mark h1 .ch {
    display: inline-block;
    min-width: 0.62em;       /* trava a largura p/ glifos de corrupção */
    text-align: center;
    will-change: transform, opacity;
  }
  .mark .tag {
    margin-top: 18px;
    font-family: var(--plex);
    font-size: 12.5px;
    letter-spacing: 0.1em;
    color: var(--g2);
    line-height: 2;
    text-transform: lowercase;
  }
  .mark .tag em { font-style: normal; color: var(--g1); }
  .mark .tag .cursor {
    display: inline-block; width: 9px; height: 15px;
    background: var(--green);
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }

  /* ---- command row (shuffle) ------------------------------------- */
  .cmd-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 18px;
    margin-top: 72px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--g4);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--g3);
    text-transform: lowercase;
  }
  .cmd {
    background: none;
    border: none;
    color: var(--g1);
    font-family: var(--pixel);
    font-size: 21px;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    padding: 2px 10px;
    cursor: crosshair;
  }
  .cmd .p { color: var(--green); }
  .cmd:hover { background: var(--white); color: var(--black); }
  .cmd:hover .p { color: var(--black); }

  /* ---- filesystem (ex-estratos) ----------------------------------- */
  .fs {
    position: relative;
    padding: 56px 0 10vh;
    min-height: 58vh;
  }
  .node-wrap { position: relative; transition: margin-left 600ms cubic-bezier(.4,0,.2,1); }
  .node-wrap + .node-wrap { margin-top: var(--gap, 60px); }

  .node {
    position: relative;
    display: block;
    width: max-content;
    max-width: 92%;
    text-decoration: none;
    cursor: crosshair;
  }
  .node .path {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    color: var(--g3);
    margin-bottom: 6px;
    text-transform: lowercase;
  }
  .node .label {
    display: inline-block;
    font-family: var(--pixel);
    line-height: 0.82;
    letter-spacing: 0.005em;
    text-transform: lowercase;
    position: relative;
    padding: 2px 8px 4px 0;
  }
  .node .desc {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--g2);
    margin-top: 8px;
    max-width: 400px;
    opacity: 0;
    transform: translateY(-3px);
    transition: opacity .25s, transform .25s;
  }
  .node:hover .desc { opacity: 1; transform: none; }
  .node:hover .desc::before { content: "> "; color: var(--green); }

  /* hover: vídeo invertido, como seleção de terminal */
  .node:hover .label {
    background: var(--white);
    color: var(--black) !important;
    box-shadow: 8px 8px 0 var(--g4);
  }

  /* hierarquia em cinzas — luminância é profundidade */
  .node.prime { color: var(--white); }
  .node.prime .label { font-size: clamp(66px, 10.5vw, 156px); }
  .node.prime .path { color: var(--g2); }

  .node.l1 { color: var(--g1); }
  .node.l1 .label { font-size: clamp(44px, 6.5vw, 92px); }
  .node.l2 { color: var(--g2); }
  .node.l2 .label { font-size: clamp(38px, 5.6vw, 78px); }
  .node.l3 { color: var(--g3); }
  .node.l3 .label { font-size: clamp(34px, 5vw, 66px); }

  /* nó sem sinal */
  .node.void { color: var(--g3); pointer-events: none; }
  .node.void .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    opacity: 0.5;
    animation: blink 2.6s steps(2) infinite;
  }

  /* glitch monocromático agressivo: fatias rasgando */
  .glitching .label { animation: slice 320ms steps(6, end); }
  @keyframes slice {
    0%   { transform: none; clip-path: none; opacity: 1; }
    12%  { transform: translateX(-14px) skewX(-5deg); clip-path: inset(5% 0 68% 0); }
    26%  { transform: translateX(11px) translateY(3px); clip-path: inset(42% 0 28% 0); opacity: .7; }
    40%  { transform: translateX(-9px) scaleX(1.04); clip-path: inset(74% 0 2% 0); }
    55%  { transform: translateX(16px) skewX(4deg); clip-path: inset(18% 0 56% 0); opacity: .85; }
    70%  { transform: translateX(-12px) translateY(-3px); clip-path: inset(60% 0 12% 0); }
    85%  { transform: translateX(6px); clip-path: inset(30% 0 40% 0); opacity: .6; }
    100% { transform: none; clip-path: none; opacity: 1; }
  }

  /* ---- foot ---------------------------------------------------------- */
  .foot {
    margin-top: 48px;
    padding-top: 18px;
    border-top: 1px solid var(--g4);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px 28px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--g3);
    text-transform: lowercase;
  }
  .foot nav { display: flex; flex-wrap: wrap; gap: 6px 24px; }
  .foot a { color: var(--g2); text-decoration: none; }
  .foot a:hover { background: var(--white); color: var(--black); }

  /* ---- mobile --------------------------------------------------------- */
  @media (max-width: 720px) {
    .shell { padding: 22px 20px 44px; }
    .topbar { flex-direction: column; gap: 8px; }
    .coords { text-align: left; }
    .mark { margin-top: 40px; }
    .boot { padding: 24px 20px; font-size: 16px; }
    .fs { padding: 40px 0 8vh; }
    .node-wrap + .node-wrap { margin-top: 44px; }
    .node { max-width: 100%; }
    .node .desc { opacity: 1; transform: none; }
    .node .desc::before { content: "> "; color: var(--green); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .boot { display: none; }
    .stage { opacity: 1; }
  }
</style>

<script>
  // ============================================================
  // STRATA como filesystem. Para adicionar um link novo, é só
  // acrescentar um objeto aqui — o sistema gera o resto sozinho.
  // ============================================================
  const STRATA = [
    {
      label: "luscofilms",
      href:  "https://www.tiktok.com/@luscofilms",
      desc:  "phantom videography · sfx-with-ai · sci-fi & horror that never premiered",

    },

    },
    {
      label: "colors from within",
      href:  "https://www.transient.xyz/nfts/ethereum/0x80bf8004eb223ada632e4b674ac0ce4d6e464922",
      desc:  "my foundation (rip) contract, now on transient. digital paintings, film and ai stuff.",
      path:  "/strata/03 · −67m",

    },
    {
      label: "objkt: art on tezos",
      href:  "https://objkt.com/users/tz1LxMnuPvqrYo4Z1TnVon1zrVu6VwJfuxwa/created",
      desc:  "digital paintings, glitched photography, films and poetry",
      path:  "/strata/04 · −94m",
      cls:   "l1",
      glitch: [5, 10]
    },
    {
      label: "music",
      href:  "som.html",
      desc:  "releases, eps and b-sides",
      path:  "/strata/05 · −115m",
      cls:   "l2",
      glitch: [7, 14]
    },
    {
      label: "fragments of acrylic",
      href:  "https://gamma.io/ordinals/collections/fragments-of-acrylic",
      desc:  "ordinal art on bitcoin · gamma",
      path:  "/strata/06 · −141m",
      cls:   "l3",
      glitch: [7, 13]
    },
    {
      label: "text",
      href:  "https://marcvscouto.substack.com",
      desc:  "essays, fiction & ghost signals · substack",
      path:  "/strata/07 · −166m",
      cls:   "l2",
      glitch: [6, 11]
    },
    {
      label: "sedimenting",
      href:  null,
      desc:  null,
      path:  "/strata/?? · −???m",
      cls:   "void",
      glitch: [9, 18]
    }
  ];

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile  = window.matchMedia('(max-width: 720px)').matches;

  // ============================================================
  // MOTOR DE CORRUPÇÃO — caracteres se degradam em glifos de
  // bloco/ruído e se recompõem. usado nos hovers.
  // ============================================================
  const GLYPHS = "█▓▒░<>/\\|#%&@*+=~^?!;:01";
  const rg = () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)];

  // h1 corrompe em glifos arcanos: apl, braille, runas, operadores
  const H1GLYPHS = [..."⍒⍋⌽⍉⊖⍟⍝⌬⌭∴∵≡∮∂∇⊗⊘⊕⌖ᚠᚱᛉᛟᚹᛞ⣿⠿⢸⡷⡇⠛ʘʬʭɸ▚▞▙▜▟╬╪╫"];
  const rh = () => H1GLYPHS[Math.floor(Math.random() * H1GLYPHS.length)];

  // corrompe e resolve: probabilidade de corrupção decai até 0
  function scrambleResolve(el, original, dur) {
    if (!el || el._scr) return;
    const t0 = performance.now();
    el._scr = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / dur);
      const p = (1 - k) * 0.85;             // começa quase tudo corrompido
      let out = "";
      for (const c of original) {
        out += (c === " " || Math.random() > p) ? c : rg();
      }
      el.textContent = out;
      if (k >= 1) stopScramble(el, original);
    }, 34);
  }
  function stopScramble(el, original) {
    if (!el) return;
    clearInterval(el._scr); el._scr = null;
    el.textContent = original;
  }

  // ---- "marcvs": desintegração por letra enquanto o mouse está em cima
  (function markDisintegrate() {
    const h1 = document.querySelector('.mark h1');
    const word = h1.textContent;
    h1.innerHTML = [...word].map(c => '<span class="ch">' + c + '</span>').join('');
    if (reduced) return;
    const chs = [...h1.querySelectorAll('.ch')];
    let raf = null, leaving = false, leaveT = 0;

    function frame() {
      const settle = leaving ? Math.min(1, (performance.now() - leaveT) / 450) : 0;
      chs.forEach((ch, i) => {
        const p = (1 - settle) * 0.8;       // intensidade da desintegração
        if (Math.random() < p) {
          // letra corrompe: glifo arcano + deslocamento + fade
          ch.textContent = rh();
          const a = (1 - settle);
          ch.style.transform =
            'translate(' + ((Math.random() - .5) * 22 * a) + 'px,' +
                           ((Math.random() - .5) * 26 * a) + 'px)' +
            ' rotate(' + ((Math.random() - .5) * 24 * a) + 'deg)';
          ch.style.opacity = (0.15 + Math.random() * 0.85).toFixed(2);
          ch.style.color = Math.random() < 0.12 ? 'var(--green)'
                         : Math.random() < 0.3  ? 'var(--g3)' : '';
        } else {
          ch.textContent = word[i];
          ch.style.transform = '';
          ch.style.opacity = '';
          ch.style.color = '';
        }
      });
      if (leaving && settle >= 1) {
        chs.forEach((ch, i) => {
          ch.textContent = word[i];
          ch.style.transform = ''; ch.style.opacity = ''; ch.style.color = '';
        });
        raf = null; return;
      }
      raf = setTimeout(frame, 42);          // ~24fps, cadência de tubo
    }

    h1.addEventListener('mouseenter', () => {
      leaving = false;
      if (!raf) frame();
    });
    h1.addEventListener('mouseleave', () => {
      leaving = true; leaveT = performance.now();
    });
  })();

  // ---- boot: terminal digitando -------------------------------
  const BOOTLINES = [
    "marcvs.sys v3.0",
    "mounting strata ............ ok",
    "loading phantom videography . ok",
    "calibrating crt ............. ok",
    "",
    "$ run marcvs.art_"
  ];
  const boot  = document.getElementById('boot');
  const stage = document.getElementById('stage');

  function enterStage() {
    boot.classList.add('done');
    stage.classList.add('on');
    setTimeout(() => boot.remove(), 300);
  }

  if (reduced) {
    boot.remove(); stage.classList.add('on');
  } else {
    let li = 0, ci = 0, out = "";
    (function type() {
      if (li >= BOOTLINES.length) { setTimeout(enterStage, 260); return; }
      const line = BOOTLINES[li];
      if (ci < line.length) {
        // blocos de 2-3 chars: rápido, como saída de sistema
        const step = 2 + Math.floor(Math.random() * 2);
        out += line.slice(ci, ci + step);
        ci += step;
        boot.textContent = out;
        setTimeout(type, 12 + Math.random() * 18);
      } else {
        out += "\n"; li++; ci = 0;
        boot.textContent = out;
        setTimeout(type, line === "" ? 60 : 110);
      }
    })();
    // pula o boot com clique ou tecla
    boot.addEventListener('click', enterStage);
    window.addEventListener('keydown', enterStage, { once: true });
  }

  // ---- wireframe floor: grid em perspectiva, early CG ----------
  const wire = document.getElementById('wire');
  const wx = wire.getContext('2d');
  function sizeWire() {
    wire.width  = window.innerWidth;
    wire.height = Math.ceil(window.innerHeight * 0.46);
  }
  sizeWire();
  window.addEventListener('resize', sizeWire);

  let t = 0;
  function drawWire() {
    const W = wire.width, H = wire.height;
    wx.clearRect(0, 0, W, H);
    const horizon = H * 0.18;
    const cx = W / 2;

    // linhas verticais convergindo no ponto de fuga
    wx.strokeStyle = "rgba(85,85,79,0.55)";
    wx.lineWidth = 1;
    const N = 24;
    for (let i = -N; i <= N; i++) {
      wx.beginPath();
      wx.moveTo(cx, horizon);
      wx.lineTo(cx + i * (W / 10), H + 40);
      wx.stroke();
    }
    // linhas horizontais que avançam (scroll infinito do chão)
    const speed = reduced ? 0 : (t % 1);
    for (let r = 0; r < 14; r++) {
      const k = (r + speed) / 14;
      const y = horizon + Math.pow(k, 2.6) * (H - horizon);
      const a = 0.12 + Math.pow(k, 2) * 0.55;
      wx.strokeStyle = "rgba(201,201,194," + a.toFixed(3) + ")";
      wx.beginPath();
      wx.moveTo(0, y); wx.lineTo(W, y);
      wx.stroke();
    }
    // linha do horizonte
    wx.strokeStyle = "rgba(244,244,240,0.35)";
    wx.beginPath(); wx.moveTo(0, horizon); wx.lineTo(W, horizon); wx.stroke();
  }
  if (reduced) { drawWire(); }
  else {
    (function loop() {
      t += 0.004;
      drawWire();
      requestAnimationFrame(loop);
    })();
  }

  // ---- build do filesystem ---------------------------------------
  const root = document.getElementById('fs');
  const rest = STRATA.slice(1);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  const FINAL = [STRATA[0], ...rest];   // luscofilms sempre no topo

  FINAL.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'node-wrap';
    wrap.style.setProperty('--gap', (48 + (i % 3) * 24) + 'px');
    const off = i === 0 ? 0 : Math.floor(Math.random() * 50);
    wrap.style.marginLeft = (mobile ? off * 0.3 : off) + '%';

    const tag = s.href ? 'a' : 'div';
    const el = document.createElement(tag);
    el.className = 'node ' + s.cls;
    if (s.href) {
      el.href = s.href;
      if (/^https?:/.test(s.href)) { el.target = '_blank'; el.rel = 'noopener'; }
    }
    el.innerHTML =
      '<span class="path">' + s.path + '</span>' +
      '<span class="label">' + s.label + '</span>' +
      (s.desc ? '<span class="desc">' + s.desc + '</span>' : '');

    if (!reduced) {
      const labelEl = () => el.querySelector('.label');
      el.addEventListener('mouseenter', () => {
        el.classList.remove('glitching'); void el.offsetWidth;
        el.classList.add('glitching');
        scrambleResolve(labelEl(), s.label, 420);
      });
      el.addEventListener('mouseleave', () => {
        stopScramble(labelEl(), s.label);
      });
      const schedule = () => {
        const [lo, hi] = s.glitch;
        setTimeout(() => {
          el.classList.remove('glitching'); void el.offsetWidth;
          el.classList.add('glitching');
          schedule();
        }, (lo + Math.random() * (hi - lo)) * 1000);
      };
      setTimeout(schedule, 1500 + Math.random() * 4000);
    }

    wrap.appendChild(el);
    root.appendChild(wrap);
  });

  // ---- shuffle --strata (FLIP) -------------------------------------
  document.getElementById('shuffleBtn').addEventListener('click', () => {
    const wraps = [...root.querySelectorAll('.node-wrap')];
    const firstRects = new Map();
    wraps.forEach(w => firstRects.set(w, w.getBoundingClientRect()));

    const shuffled = wraps.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    shuffled.forEach(w => {
      root.appendChild(w);
      w.style.marginLeft = Math.floor(Math.random() * 50 * (mobile ? 0.3 : 1)) + '%';
    });

    requestAnimationFrame(() => {
      shuffled.forEach((w, i) => {
        const last = w.getBoundingClientRect();
        const first = firstRects.get(w);
        w.style.transition = 'none';
        w.style.transform = 'translate(' + (first.left - last.left) + 'px,' + (first.top - last.top) + 'px)';
        void w.offsetWidth;
        w.style.transition = 'transform 600ms cubic-bezier(.4,0,.2,1)';
        w.style.transform = 'translate(0,0)';

        if (!reduced) {
          const el = w.querySelector('.node');
          setTimeout(() => {
            el.classList.remove('glitching'); void el.offsetWidth;
            el.classList.add('glitching');
          }, i * 70);
        }
      });
    });

    setTimeout(() => {
      shuffled.forEach(w => { w.style.transition = ''; w.style.transform = ''; });
    }, 700);
  });
</script>
</body>
</html>
