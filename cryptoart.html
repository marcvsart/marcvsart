<style>
  /* marcvs.art v3 — MAINFRAME · /strata/02/cryptoart */
  :root {
    --black:#060707; --white:#f4f4f0;
    --g1:#c9c9c2; --g2:#8e8e88; --g3:#55554f; --g4:#2c2c28;
    --green:#5ac8fa; /* azul fantasma */
    --pixel:"VT323",monospace;
    --plex:"IBM Plex Mono",ui-monospace,monospace;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    background:var(--black); color:var(--g1);
    font-family:var(--mono); font-size:16px;
    overflow-x:hidden;
  }
  ::selection { background:var(--white); color:var(--black); }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px);
  }
  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
  }
  body { opacity:0; }
  body.on { animation:tube-on 360ms steps(4) forwards; }
  @keyframes tube-on {
    0% { opacity:0; filter:brightness(2.4); }
    100% { opacity:1; filter:none; }
  }

  .shell { position:relative; z-index:2; max-width:1240px; margin:0 auto; padding:36px 64px 56px; }

  .topbar {
    display:flex; justify-content:space-between; align-items:baseline; gap:24px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em;
    color:var(--g3); text-transform:lowercase;
  }
  .topbar .sys { color:var(--green); }
  .topbar .sys a { color:inherit; text-decoration:none; }
  .topbar .sys .blink { animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .topbar nav { display:flex; gap:18px; }
  .topbar nav a { color:var(--g2); text-decoration:none; }
  .topbar nav a:hover { background:var(--white); color:var(--black); }
  .topbar nav a.here { color:var(--white); }
  .topbar nav a.here::before { content:"["; color:var(--green); }
  .topbar nav a.here::after  { content:"]"; color:var(--green); }

  .mark { margin-top:72px; }
  .mark .cmdline {
    font-family:var(--plex); font-size:12px; letter-spacing:0.08em;
    color:var(--g3); text-transform:lowercase; margin-bottom:14px;
  }
  .mark .cmdline .prompt { color:var(--green); }
  .mark h1 {
    margin:0; font-family:"Workbench",var(--pixel); font-weight:400;
    font-size:clamp(38px,5vw,60px); letter-spacing:0.18em;
    text-transform:lowercase; color:var(--white); line-height:1;
  }
  .mark .tag {
    margin-top:18px; font-family:var(--plex); font-weight:500; font-size:13px;
    letter-spacing:0.1em; color:var(--g2); line-height:2; text-transform:lowercase;
  }
  .mark .tag em { font-style:normal; color:var(--white); }
  .mark .tag .cursor {
    display:inline-block; width:9px; height:15px; background:var(--green);
    vertical-align:-2px; animation:blink 1s steps(1) infinite;
  }

  /* ---- nodes espalhados, como na home -------------------------- */
  .fs { position:relative; padding:56px 0 12vh; }
  .node-wrap + .node-wrap { margin-top: var(--gap, 56px); }
  .node {
    position:relative; display:block;
    width:max-content; max-width:92%;
    text-decoration:none; cursor:crosshair;
  }
  .node .path {
    display:block; font-family:var(--mono); font-size:10.5px;
    letter-spacing:0.12em; color:var(--g3);
    margin-bottom:6px; text-transform:lowercase;
  }
  .node .label {
    display:inline-block; font-family:"Workbench",var(--pixel);
    line-height:0.92; letter-spacing:0.005em; text-transform:lowercase;
    position:relative; padding:2px 8px 4px 0;
  }
  .node .desc {
    display:block; font-family:var(--mono); font-size:11px;
    letter-spacing:0.05em; color:var(--g2); margin-top:8px;
    max-width:400px; opacity:0; transform:translateY(-3px);
    transition:opacity .25s, transform .25s;
  }
  .node:hover .desc { opacity:1; transform:none; }
  .node:hover .desc::before { content:"> "; color:var(--green); }
  .node:hover .label { background:var(--white); color:var(--black) !important; box-shadow:8px 8px 0 var(--g4); }

  .node.l0 { color:var(--white); }
  .node.l0 .label { font-variation-settings:'BLED' 0,'SCAN' 0; }
  .node.l1 .label { font-variation-settings:'BLED' 0,'SCAN' 38; }
  .node.l2 .label { font-variation-settings:'BLED' 42,'SCAN' 0; }
  .node.l0 .label { font-size:clamp(44px,6.8vw,96px); }
  .node.l1 { color:var(--g1); }
  .node.l1 .label { font-size:clamp(38px,5.8vw,80px); }
  .node.l2 { color:var(--g2); }
  .node.l2 .label { font-size:clamp(34px,5vw,68px); }

  .glitching .label { animation:slice 320ms steps(6,end); }
  @keyframes slice {
    0%   { transform:none; clip-path:none; opacity:1; }
    12%  { transform:translateX(-14px) skewX(-5deg); clip-path:inset(5% 0 68% 0); }
    26%  { transform:translateX(11px) translateY(3px); clip-path:inset(42% 0 28% 0); opacity:.7; }
    40%  { transform:translateX(-9px) scaleX(1.04); clip-path:inset(74% 0 2% 0); }
    55%  { transform:translateX(16px) skewX(4deg); clip-path:inset(18% 0 56% 0); opacity:.85; }
    70%  { transform:translateX(-12px) translateY(-3px); clip-path:inset(60% 0 12% 0); }
    85%  { transform:translateX(6px); clip-path:inset(30% 0 40% 0); opacity:.6; }
    100% { transform:none; clip-path:none; opacity:1; }
  }

  .foot {
    margin-top:48px; padding-top:18px; border-top:1px solid var(--g4);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 28px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em;
    color:var(--g3); text-transform:lowercase;
  }
  .foot a { color:var(--g2); text-decoration:none; }
  .foot a:hover { background:var(--white); color:var(--black); }

  @media (max-width:720px) {
    .shell { padding:22px 20px 44px; }
    .topbar { flex-direction:column; gap:10px; }
    .mark { margin-top:40px; }
    .fs { padding:40px 0 8vh; }
    .node-wrap + .node-wrap { margin-top:40px; }
    .node { max-width:100%; }
    .node .desc { opacity:1; transform:none; }
    .node .desc::before { content:"> "; color:var(--green); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    body { opacity:1; }
  }
</style>

<div class="shell">

<script>
  const NODES = [
    {
      label: "portraits of the basilisk",
      href:  "https://www.transient.xyz/nfts/ethereum/0x6f2ef204ab017c648f8c4f1ec49f731827d14ff2",
      desc:  "hand-painted portraits of the machine unconscious \u00b7 ethereum",
      path:  "/cryptoart/00 \u00b7 ethereum",
      cls:   "l0",
      glitch: [5, 10]
    },
    {
      label: "my drawer of dreams",
      href:  "https://manifold.xyz/@marcvs",
      desc:  "contract on ethereum (manifold). mostly ai stuff",
      path:  "/cryptoart/01 · ethereum",
      cls:   "l1",
      glitch: [5, 10]
    },
    {
      label: "colors from within",
      href:  "https://www.transient.xyz/nfts/ethereum/0x80bf8004eb223ada632e4b674ac0ce4d6e464922",
      desc:  "my foundation (rip) contract, now on transient. digital paintings, film and ai stuff.",
      path:  "/cryptoart/02 · ethereum",
      cls:   "l1",
      glitch: [6, 12]
    },
    {
      label: "objkt: art on tezos",
      href:  "https://objkt.com/users/tz1LxMnuPvqrYo4Z1TnVon1zrVu6VwJfuxwa/created",
      desc:  "digital paintings, glitched photography, films and poetry",
      path:  "/cryptoart/03 · tezos",
      cls:   "l1",
      glitch: [5, 11]
    },
    {
      label: "fragments of acrylic",
      href:  "https://gamma.io/ordinals/collections/fragments-of-acrylic",
      desc:  "ordinal art on bitcoin · gamma",
      path:  "/cryptoart/04 · bitcoin",
      cls:   "l2",
      glitch: [7, 13]
    }
  ];

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile  = window.matchMedia('(max-width: 720px)').matches;

  document.body.classList.add('on');

  const root = document.getElementById('fs');
  const rest = NODES.slice(1);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  const list = [NODES[0], ...rest];   // basilisk sempre no topo

  list.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'node-wrap';
    wrap.style.setProperty('--gap', (44 + (i % 3) * 20) + 'px');
    const off = i === 0 ? 0 : Math.floor(Math.random() * 45);
    wrap.style.marginLeft = (mobile ? off * 0.3 : off) + '%';

    const el = document.createElement('a');
    el.className = 'node ' + s.cls;
    el.href = s.href;
    el.target = '_blank'; el.rel = 'noopener';
    el.innerHTML =
      '<span class="path">' + s.path + '</span>' +
      '<span class="label">' + s.label + '</span>' +
      '<span class="desc">' + s.desc + '</span>';

    if (!reduced) {
      el.addEventListener('mouseenter', () => {
        el.classList.remove('glitching'); void el.offsetWidth;
        el.classList.add('glitching');
      });
      const schedule = () => {
        const [lo, hi] = s.glitch;
        setTimeout(() => {
          el.classList.remove('glitching'); void el.offsetWidth;
          el.classList.add('glitching');
          schedule();
        }, (lo + Math.random() * (hi - lo)) * 1000);
      };
      setTimeout(schedule, 1500 + Math.random() * 4000);
    }

    wrap.appendChild(el);
    root.appendChild(wrap);
  });
</script>
