<style>
  .sub-shell { max-width: 1080px; padding: 44px 80px 60px; }
  @media (max-width: 720px) { .sub-shell { padding: 28px 28px 48px; } }

  .mark { font-family: var(--serif); font-style: italic; font-size: 22px; letter-spacing: -0.01em; }
  .mark a { border-bottom: none; }

  /* chapter header grid (shared across subpages) */
  .chapter-head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: end;
    margin: 80px 0 64px;
  }
  .chapter-head .title {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(96px, 14vw, 192px);
    line-height: 0.9;
    letter-spacing: -0.025em;
  }
  .chapter-head .meta-col {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-bottom: 14px;
    line-height: 1.7;
  }
  .chapter-head .meta-col .desc {
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    color: var(--fg);
    text-transform: none;
    letter-spacing: 0;
    line-height: 1.4;
    margin-bottom: 20px;
    max-width: 420px;
  }
  .chapter-head .meta-col .row { display: flex; justify-content: space-between; border-top: 1px solid var(--rule-soft); padding: 8px 0; }
  .chapter-head .meta-col .row span:last-child { color: var(--fg); }

  /* list of entries */
  .entries { border-top: 1px solid var(--rule); }
  .entry {
    display: grid;
    grid-template-columns: 80px 1fr 220px 90px;
    gap: 32px;
    align-items: baseline;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule-soft);
    text-decoration: none;
    color: inherit;
    transition: padding-left .3s ease, background-color .3s ease;
  }
  .entry:hover { padding-left: 12px; background: rgba(26,23,19,0.03); }
  .entry:hover .arrow { transform: translateX(6px); }

  .entry .n {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .entry .title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .entry .where {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .entry .arrow {
    font-family: var(--mono);
    font-size: 12px;
    text-align: right;
    color: var(--ink-soft);
    transition: transform .3s ease;
  }

  @media (max-width: 720px) {
    .chapter-head { grid-template-columns: 1fr; gap: 18px; margin: 48px 0 40px; }
    .entry { grid-template-columns: 40px 1fr; gap: 14px; }
    .entry .where, .entry .arrow { display: none; }
  }
</style>
